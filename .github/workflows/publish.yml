name: Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    permissions:
      contents: write
      id-token: write
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:packed
      - run: npm audit --audit-level=low
      - name: Publish changed version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          VERSIONS=$(npm view "$PACKAGE_NAME" versions --json)
          if node -e 'process.exit(JSON.parse(process.argv[1]).includes(process.argv[2]) ? 0 : 1)' "$VERSIONS" "$PACKAGE_VERSION"; then
            echo "Version $PACKAGE_VERSION is already published."
          else
            npm publish --access public
          fi
          if ! gh release view "$PACKAGE_VERSION" > /dev/null 2>&1; then
            gh release create "$PACKAGE_VERSION" --target "$GITHUB_SHA" --title "v$PACKAGE_VERSION" --generate-notes
          fi
